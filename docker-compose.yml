services:
  postgres:
    image: postgres:14
    container_name: nest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loy
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nest_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  api:
    build: .
    container_name: nest_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
